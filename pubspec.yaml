name: photo_cleaner
description: Photo cleanup app — find and remove blurry photos and duplicates
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Storage & database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.3.1

  # Image processing
  image: ^4.2.0
  photo_manager: ^3.3.0

  # File operations
  permission_handler: ^11.3.1

  # Photo editor
  pro_image_editor: ^7.0.5
  emoji_picker_flutter: 4.3.0

  # Background work
  workmanager: ^0.5.2

  # Utilities
  crypto: ^3.0.3
  collection: ^1.18.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
